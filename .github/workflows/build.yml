name: Build fping for Windows

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ------------------------------------------------------------------ #
  # Compile fping.exe for x64 and arm64, upload both as artifacts.     #
  # Runs on every push / PR / manual trigger.                          #
  # ------------------------------------------------------------------ #
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            triple: x86_64-w64-mingw32
          - arch: arm64
            triple: aarch64-w64-mingw32

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # llvm-mingw provides both x86_64-w64-mingw32-clang and
      # aarch64-w64-mingw32-clang in a single toolchain.  We pin a release
      # for reproducible builds.
      - name: Set up llvm-mingw
        shell: pwsh
        run: |
          $ver = "20251216"
          $zip = "llvm-mingw-$ver-ucrt-x86_64.zip"
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/$ver/$zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\llvm-mingw"
          $bin = Get-ChildItem "$env:RUNNER_TEMP\llvm-mingw" -Directory | Select-Object -First 1
          echo "$($bin.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "LLVM_MINGW_BIN=$($bin.FullName)\bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify toolchain
        shell: pwsh
        run: |
          & "x86_64-w64-mingw32-clang" --version | Select-Object -First 1
          & "aarch64-w64-mingw32-clang" --version | Select-Object -First 1

      - name: Build (${{ matrix.arch }})
        shell: bash
        run: |
          make clean || true
          make TRIPLE=${{ matrix.triple }}

      - name: Smoke test (x64 only)
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          ./fping.exe -v
          ./fping.exe -h
        # arm64 binary cannot run on the x64 runner; we only verify it links.

      - name: Verify PE architecture
        shell: pwsh
        run: |
          $bytes = [System.IO.File]::ReadAllBytes("fping.exe")
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          $archName = switch ($machine) { 0x8664 { "x64 (AMD64)" } 0xAA64 { "ARM64" } default { "unknown (0x{0:X4})" -f $machine } }
          Write-Host "fping.exe machine type: $archName"

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path fping.exe -DestinationPath "fping-windows-${{ matrix.arch }}.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fping-windows-${{ matrix.arch }}
          path: fping-windows-${{ matrix.arch }}.zip
          retention-days: 30

  # ------------------------------------------------------------------ #
  # Extract the release tag (only meaningful for tag pushes).          #
  # ------------------------------------------------------------------ #
  metadata:
    name: Metadata
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Compute tag
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------ #
  # Generate the changelog for this tag (release-notes.md) and refresh #
  # the cumulative CHANGELOG.md on the default branch.  Tag pushes only.#
  # ------------------------------------------------------------------ #
  changelog:
    name: Generate changelog
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch (full history + tags)
        uses: actions/checkout@v4
        with:
          # Stay on the default branch so the CHANGELOG.md commit can be
          # pushed back cleanly.  fetch-depth: 0 pulls every tag, which the
          # changelog script needs to compute per-version commit ranges.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Generate release notes and full changelog
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          python scripts/generate_changelog.py --tag "$RELEASE_TAG" > release-notes.md
          python scripts/generate_changelog.py --all --output CHANGELOG.md
          test -s release-notes.md
          test -s CHANGELOG.md

      - name: Upload release metadata
        uses: actions/upload-artifact@v4
        with:
          name: release-metadata
          path: release-notes.md
          if-no-files-found: error
          retention-days: 7

      - name: Commit changelog to default branch
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "CHANGELOG.md 无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore 🔧: 更新 CHANGELOG"
          git push origin "HEAD:$DEFAULT_BRANCH"

  # ------------------------------------------------------------------ #
  # Publish the GitHub Release with the generated changelog as the     #
  # body and both architecture zips attached.  Tag pushes only.        #
  # ------------------------------------------------------------------ #
  release:
    name: Publish GitHub Release
    needs: [metadata, build, changelog]
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: assets

      - name: Download release metadata
        uses: actions/download-artifact@v4
        with:
          name: release-metadata
          path: assets/metadata

      - name: Verify assets
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/metadata/release-notes.md
          test -s "assets/fping-windows-x64/fping-windows-x64.zip"
          test -s "assets/fping-windows-arm64/fping-windows-arm64.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          name: ${{ needs.metadata.outputs.tag }}
          body_path: assets/metadata/release-notes.md
          files: |
            assets/fping-windows-x64/fping-windows-x64.zip
            assets/fping-windows-arm64/fping-windows-arm64.zip
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
